services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bloodnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloodnet_ai}
      POSTGRES_USER: ${POSTGRES_USER:-bloodnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloodnet_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloodnet} -d ${POSTGRES_DB:-bloodnet_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bloodnet-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: bloodnet-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloodnet}:${POSTGRES_PASSWORD:-bloodnet_dev_password}@postgres:5432/${POSTGRES_DB:-bloodnet_ai}
      REDIS_URL: redis://redis:6379
      PORT: 8000
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bloodnet-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloodnet}:${POSTGRES_PASSWORD:-bloodnet_dev_password}@postgres:5432/${POSTGRES_DB:-bloodnet_ai}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: bloodnet-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
